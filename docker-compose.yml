name: pgland

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pgland
      POSTGRES_PASSWORD: pgland
      POSTGRES_DB: pgland
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgland -d pgland"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
